baseURL = 'https://theorestes.github.io/'
languageCode = 'en-us'
title = "The Pixel Dump"
theme = "enervoid-theme"

[menus]
  [[menus.main]]
    name = 'Blog'
    pageRef = '/blog'
    weight = 10

  [[menus.main]]
    name = 'Personal'
    pageRef = '/personal'
    weight = 20

  [[menus.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 30

[params]
  avatar = "/images/website_icon.jpg"

  [[params.socials]]
      link = "https://github.com/TheOrestes"
      icon = "devicon-github-original"
  [[params.socials]]
      link = "https://x.com/rupeshmandke"
      icon = "devicon-twitter-original"
   [[params.socials]]
      link = "https://www.linkedin.com/in/rupesh-mandke-27a7234"
      icon = "devicon-linkedin-plain"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$','$$'], ['\\[','\\]']]
        inline = [['$','$'], ['\\(','\\)']]

    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

[markup.highlight]
  noClasses = true
  codeFences = true
  guessSyntax = true
  tabWidth = 4
  style = "monokai"
# Mount static/ into assets/ as well as static/.
#
# Post images live in static/, where Hugo cannot process them -- so the blog
# index was serving 1.8 MB originals into a 120px thumbnail, 7.4 MB of images
# on one page. Mounting the same directory at assets/ lets resources.Get find
# them for resizing while they keep being served from their original URLs.
#
# Declaring any mount replaces the defaults, so every standard mount is listed.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static"
    target = "assets"

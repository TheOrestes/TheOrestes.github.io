<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">

<head>
  {{ partial "head.html" . }}
</head>

<body class="min-h-screen flex flex-col bg-[color:var(--bg)] font-jersey text-white text-3xl">
  <header>
    {{ partial "header.html" . }}
  </header>

  <main class="flex-1 w-full">
    <div id="swup" class="swup-transition-fade">
      <div class="max-w-3xl lg:max-w-6xl xl:max-w-7xl mx-auto px-5 sm:px-8 lg:px-10 py-10 lg:py-16">
        {{ block "main" . }}{{ end }}
      </div>

    </div>
  </main>

  <footer>
    {{ partial "footer.html" . }}
  </footer>

  <script>
    // Delegated, so it keeps working after swup swaps the page content.
    document.addEventListener('click', function (e) {
      var b = e.target.closest('.copy-btn');
      if (!b) return;
      var code = b.closest('.my-7').querySelector('code');
      var done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1400); };
      try { navigator.clipboard.writeText(code.textContent).then(done, done); } catch (err) { done(); }
    });
    window.addEventListener('scroll', function () {
      var bar = document.getElementById('read-progress');
      if (!bar) return;
      var max = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%';
    }, { passive: true });
  </script>
</body>

</html>

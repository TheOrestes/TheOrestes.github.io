  <text class="dim" x="536" y="286">every cell covered</text>
  <text class="dim" x="536" y="312">One random point inside each cell. Even coverage</text>
  <text class="dim" x="536" y="330">from the grid, randomness from the offset. This is</text>
  <text class="dim" x="536" y="348">the one Initialize() actually constructs.</text>
  <rect x="34" y="374" width="12" height="12" fill="#d95926" fill-opacity="0.13"/>
  <text class="dim" x="54" y="384">a cell no sample landed in</text>
</svg>
  <text class="dim" x="285" y="286">every cell covered</text>
  <text class="dim" x="285" y="312">The centre of every cell. Perfectly even — and</text>
  <text class="dim" x="285" y="330">identical in every pixel of the image, which turns</text>
  <text class="dim" x="285" y="348">noise into a fixed pattern you can see.</text>
  <text class="mono" x="536" y="64">JitteredSampler</text>

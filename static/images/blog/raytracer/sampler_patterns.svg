  <text class="dim" x="34" y="286">6 of 16 cells empty</text>
  <text class="dim" x="34" y="312">Two uniform randoms per sample. Nothing stops</text>
  <text class="dim" x="34" y="330">four of them landing in one corner and none in</text>
  <text class="dim" x="34" y="348">the next, so the pixel is unevenly covered.</text>
  <text class="mono" x="285" y="64">RegularSampler</text>
  <line x1="332.5" y1="74" x2="332.5" y2="264.0" stroke="#374151" stroke-width="0.8"/>

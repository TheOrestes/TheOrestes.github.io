<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Sixteen samples inside one pixel, placed three ways: uniformly random, at grid centres, and one random point per grid cell.">
  <style>
    .ttl  { font-family: system-ui, sans-serif; font-size: 13px; fill: #c7d2fe; }
    .dim  { font-family: system-ui, sans-serif; font-size: 11.5px; fill: #9ca3af; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11.5px; fill: #d1d5db; }
  </style>
  <text class="ttl" x="34" y="30">sixteen samples inside one pixel</text>
  <text class="dim" x="34" y="52">The grid is the sampler&#8217;s own 4&#215;4 subdivision — numSets = sqrt(16).</text>
  <text class="mono" x="34" y="64">RandomSampler</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Two ways to get a rendered pixel onto the screen: one GDI SetPixel call per pixel, against writing into plain memory and uploading it as a texture drawn on two triangles.">
  <defs>
    <marker id="pt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="pt-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
  </defs>
  <style>
    .ttl  { font-family: system-ui, sans-serif; font-size: 13px; fill: #c7d2fe; }
    .lbl  { font-family: system-ui, sans-serif; font-size: 12px; fill: #d1d5db; }
    .dim  { font-family: system-ui, sans-serif; font-size: 11.5px; fill: #9ca3af; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11.5px; }
  </style>

  <text class="ttl" x="30" y="28">one call per pixel</text>

  <g fill="#d95926" fill-opacity="0.22" stroke="#d95926" stroke-width="0.9">
    <rect x="34" y="52" width="15" height="15"/><rect x="53" y="52" width="15" height="15"/>
    <rect x="72" y="52" width="15" height="15"/><rect x="91" y="52" width="15" height="15"/>
    <rect x="34" y="71" width="15" height="15"/><rect x="53" y="71" width="15" height="15"/>
    <rect x="72" y="71" width="15" height="15"/><rect x="91" y="71" width="15" height="15"/>
    <rect x="34" y="90" width="15" height="15"/><rect x="53" y="90" width="15" height="15"/>
    <rect x="72" y="90" width="15" height="15"/><rect x="91" y="90" width="15" height="15"/>
  </g>
  <text class="dim" x="34" y="124">every pixel, one at a time</text>

  <line x1="120" y1="78" x2="196" y2="78" stroke="#6b7280" stroke-width="1.2" marker-end="url(#pt-a)"/>
  <line x1="120" y1="60" x2="196" y2="74" stroke="#6b7280" stroke-width="1" marker-end="url(#pt-a)"/>
  <line x1="120" y1="96" x2="196" y2="82" stroke="#6b7280" stroke-width="1" marker-end="url(#pt-a)"/>

  <rect x="200" y="56" width="140" height="46" rx="4" fill="#d95926" fill-opacity="0.12" stroke="#d95926" stroke-width="1.4"/>
  <text class="mono" x="212" y="76" fill="#d95926">SetPixel(hdc,</text>
  <text class="mono" x="212" y="93" fill="#d95926">  x, y, rgb)</text>

  <line x1="270" y1="102" x2="270" y2="146" stroke="#6b7280" stroke-width="1.2" marker-end="url(#pt-a)"/>
  <rect x="200" y="150" width="140" height="34" rx="4" fill="#111114" stroke="#374151" stroke-width="1.2"/>
  <text class="mono dim" x="222" y="171">window DC</text>

  <text class="dim" x="30" y="216">A device context is one shared resource, so the calls</text>
  <text class="dim" x="30" y="234">queue behind each other however many threads make</text>
  <text class="dim" x="30" y="252">them. At 480 × 270 that is</text>
  <text class="mono" x="30" y="276" fill="#d95926">129,600 calls per frame</text>
  <text class="dim" x="30" y="300">and posts 5 and 6 are about what that costs.</text>

  <line x1="400" y1="20" x2="400" y2="450" stroke="#374151" stroke-width="1"/>

  <text class="ttl" x="430" y="28">one call per row</text>

  <rect x="434" y="52" width="115" height="53" fill="#3987e5" fill-opacity="0.14" stroke="#3987e5" stroke-width="1.4"/>
  <line x1="434" y1="70" x2="549" y2="70" stroke="#3987e5" stroke-width="0.8"/>
  <line x1="434" y1="88" x2="549" y2="88" stroke="#3987e5" stroke-width="0.8"/>
  <text class="mono dim" x="434" y="124">vector&lt;glm::vec3&gt;</text>
  <text class="dim" x="434" y="142">plain memory — no API, no lock</text>

  <line x1="560" y1="78" x2="614" y2="78" stroke="#34d399" stroke-width="1.4" marker-end="url(#pt-g)"/>

  <rect x="618" y="52" width="126" height="53" rx="4" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
  <text class="mono" x="628" y="72" fill="#34d399">glTexSubImage2D</text>
  <text class="mono" x="628" y="92" fill="#34d399">GL_RGB, GL_FLOAT</text>

  <line x1="681" y1="105" x2="681" y2="166" stroke="#34d399" stroke-width="1.4" marker-end="url(#pt-g)"/>

  <rect x="600" y="170" width="162" height="0.001" fill="none"/>
  <path d="M604,232 L604,172 L762,172 z" fill="#818cf8" fill-opacity="0.18" stroke="#818cf8" stroke-width="1.3"/>
  <path d="M604,232 L762,172 L762,232 z" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-width="1.3"/>
  <text class="dim" x="604" y="252">two triangles, NDC −1 to 1</text>

  <text class="dim" x="430" y="300">The tracer writes into an ordinary array. The GPU is</text>
  <text class="dim" x="430" y="318">handed a whole row at a time and draws it as a texture</text>
  <text class="dim" x="430" y="336">on a quad that exactly covers the window:</text>
  <text class="mono" x="430" y="360" fill="#34d399">270 calls per frame</text>

  <text class="dim" x="430" y="392">The fragment shader is the entire display pipeline:</text>
  <text class="mono dim" x="430" y="418">outColor = texture(screenTexture, vs_outTexcoord);</text>

  <text class="dim" x="30" y="392">Threads writing to different rows of an array need</text>
  <text class="dim" x="30" y="410">nothing from each other. That is the whole change —</text>
  <text class="dim" x="30" y="428">the pixels stop going through a resource that can</text>
  <text class="dim" x="30" y="446">only be used by one thread at a time.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Lambertian scattering: a unit sphere sits tangent to the surface one normal-length above the hit point, and the scattered ray is aimed at a random point inside it">
  <defs>
    <marker id="lam-ray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/>
    </marker>
    <marker id="lam-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <pattern id="lam-hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#374151" stroke-width="3"/>
    </pattern>
  </defs>

  <style>
    .lbl  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d1d5db; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
    .dim  { fill: #9ca3af; font-size: 12px; }
  </style>

  <!-- the surface -->
  <rect x="60" y="300" width="640" height="46" fill="url(#lam-hatch)" opacity="0.65"/>
  <line x1="60" y1="300" x2="700" y2="300" stroke="#9ca3af" stroke-width="1.8"/>

  <!-- tangent unit sphere -->
  <circle cx="280" cy="200" r="100" fill="#818cf8" fill-opacity="0.08" stroke="#818cf8" stroke-width="1.5"/>
  <circle cx="280" cy="200" r="3.5" fill="#818cf8"/>
  <text class="lbl mono" x="292" y="196" fill="#818cf8">P + N</text>

  <!-- incoming ray -->
  <line x1="120" y1="178" x2="276" y2="296" stroke="#e5e7eb" stroke-width="1.6" stroke-opacity="0.75" marker-end="url(#lam-ray)"/>
  <text class="lbl dim" x="104" y="168">incoming ray</text>

  <!-- normal -->
  <line x1="280" y1="300" x2="280" y2="204" stroke="#fbbf24" stroke-width="2.6" marker-end="url(#lam-n)"/>
  <text class="lbl mono" x="246" y="256" fill="#fbbf24">N</text>
  <text class="lbl dim"  x="196" y="274">unit length</text>

  <!-- random point inside the sphere: this dot IS the target, P + N + s -->
  <circle cx="330" cy="165" r="5.5" fill="#34d399"/>
  <text class="lbl mono" x="342" y="160" fill="#34d399">target</text>
  <line x1="284" y1="197" x2="326" y2="168" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="lbl mono" x="292" y="182" fill="#34d399">s</text>

  <!-- scattered ray: from P, straight through the target -->
  <line x1="280" y1="300" x2="357" y2="92" stroke="#e5e7eb" stroke-width="1.8" marker-end="url(#lam-ray)"/>
  <text class="lbl mono" x="366" y="86">scattered</text>
  <text class="lbl mono dim" x="366" y="104">target = P + N + s</text>

  <!-- hit point -->
  <circle cx="280" cy="300" r="5.5" fill="#e5e7eb"/>
  <text class="lbl mono" x="258" y="324">P</text>

  <text class="lbl dim" x="470" y="164">The sphere is tangent at P, so it sits</text>
  <text class="lbl dim" x="470" y="182">entirely above the surface — every</text>
  <text class="lbl dim" x="470" y="200">target points away from the solid.</text>

  <text class="lbl dim" x="470" y="234">Directions near N have more of the</text>
  <text class="lbl dim" x="470" y="252">sphere behind them than the horizon</text>
  <text class="lbl dim" x="470" y="270">does — that bias is the cosine falloff.</text>

  <text class="lbl mono" x="60" y="392" fill="#818cf8">d = (P + N + s) − P = N + s</text>
  <text class="lbl dim"  x="60" y="410">no light position · no N · L · no shadow ray — the recursion finds the light on its own</text>
</svg>

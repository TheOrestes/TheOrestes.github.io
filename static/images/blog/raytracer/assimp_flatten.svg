<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="How a loaded model is flattened: a node tree holding mesh indices, meshes holding vertices and faces, and finally one flat vector of Triangle pointers.">
  <defs>
    <marker id="af-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="af-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <style>
    .ttl { font-family: system-ui, sans-serif; font-size: 12.5px; fill: #c7d2fe; }
    .box { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11px; fill: #e5e7eb; }
    .dim { font-family: system-ui, sans-serif; font-size: 11px; fill: #9ca3af; }
    .cap { font-family: system-ui, sans-serif; font-size: 11.5px; fill: #d1d5db; }
  </style>

  <!-- stage 1: node tree -->
  <text class="ttl" x="30" y="36">aiNode tree</text>
  <rect x="30" y="50" width="150" height="26" rx="3" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-width="1.1"/>
  <text class="box" x="40" y="68">mRootNode</text>
  <line x1="50" y1="76" x2="50" y2="98" stroke="#6b7280" stroke-width="1"/>
  <line x1="50" y1="98" x2="66" y2="98" stroke="#6b7280" stroke-width="1"/>
  <line x1="50" y1="76" x2="50" y2="140" stroke="#6b7280" stroke-width="1"/>
  <line x1="50" y1="140" x2="66" y2="140" stroke="#6b7280" stroke-width="1"/>
  <rect x="66" y="86" width="114" height="24" rx="3" fill="#818cf8" fill-opacity="0.08" stroke="#818cf8" stroke-width="1"/>
  <text class="box" x="74" y="102">mMeshes 0,1</text>
  <rect x="66" y="128" width="114" height="24" rx="3" fill="#818cf8" fill-opacity="0.08" stroke="#818cf8" stroke-width="1"/>
  <text class="box" x="74" y="144">mMeshes 2</text>
  <text class="dim" x="30" y="176">indices only —</text>
  <text class="dim" x="30" y="192">no geometry here</text>

  <line x1="188" y1="110" x2="216" y2="110" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#af-a)"/>
  <text class="dim" x="202" y="152" text-anchor="middle" transform="rotate(-90 202 152)">ProcessNode</text>

  <!-- stage 2: meshes -->
  <text class="ttl" x="234" y="36">aiScene → mMeshes[]</text>
  <rect x="234" y="50" width="150" height="26" rx="3" fill="#199e70" fill-opacity="0.12" stroke="#199e70" stroke-width="1.1"/>
  <text class="box" x="244" y="68">aiMesh 0</text>
  <rect x="234" y="82" width="150" height="26" rx="3" fill="#199e70" fill-opacity="0.12" stroke="#199e70" stroke-width="1.1"/>
  <text class="box" x="244" y="100">aiMesh 1</text>
  <rect x="234" y="114" width="150" height="26" rx="3" fill="#199e70" fill-opacity="0.12" stroke="#199e70" stroke-width="1.1"/>
  <text class="box" x="244" y="132">aiMesh 2</text>
  <text class="dim" x="234" y="176">the data actually</text>
  <text class="dim" x="234" y="192">lives here</text>

  <line x1="392" y1="110" x2="420" y2="110" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#af-a)"/>
  <text class="dim" x="406" y="152" text-anchor="middle" transform="rotate(-90 406 152)">ProcessMesh</text>

  <!-- stage 3: vertices + faces -->
  <text class="ttl" x="438" y="36">vertices + faces</text>
  <rect x="438" y="50" width="160" height="40" rx="3" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="1.1"/>
  <text class="box" x="448" y="66">mVertices[]</text>
  <text class="dim" x="448" y="82">772 positions</text>

  <rect x="438" y="98" width="160" height="54" rx="3" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="1.1"/>
  <text class="box" x="448" y="114">mFaces[]</text>
  <text class="dim" x="448" y="130">each three indices</text>
  <text class="dim" x="448" y="146">into mVertices</text>

  <text class="dim" x="438" y="176">aiProcess_Triangulate</text>
  <text class="dim" x="438" y="192">guarantees three</text>

  <line x1="606" y1="110" x2="634" y2="110" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#af-a)"/>

  <!-- stage 4: flat vector -->
  <text class="ttl" x="640" y="36">what I keep</text>
  <rect x="640" y="50" width="100" height="102" rx="3" fill="#d95926" fill-opacity="0.12" stroke="#d95926" stroke-width="1.2"/>
  <text class="box" x="648" y="68">vector&lt;</text>
  <text class="box" x="648" y="84">  Triangle*</text>
  <text class="box" x="648" y="100">&gt;</text>
  <text class="dim" x="648" y="124">1503 of them,</text>
  <text class="dim" x="648" y="140">flat</text>

  <!-- footer -->
  <line x1="30" y1="222" x2="730" y2="222" stroke="#374151" stroke-width="1"/>

  <text class="cap" x="30" y="250">The tree is organisation, not data. Nodes carry indices; the meshes hang off the scene.</text>

  <text class="dim" x="30" y="282">Three things this flattening throws away, all of which I get to pay for later:</text>

  <text class="dim" x="46" y="312">· node transforms — ProcessNode never reads node-&gt;mTransformation, so a model whose parts sit at</text>
  <text class="dim" x="60" y="330">  different places in the hierarchy gets assembled with everything at the origin</text>

  <text class="dim" x="46" y="356">· per-mesh materials — every triangle gets the one Material* the whole mesh was constructed with</text>

  <text class="dim" x="46" y="382">· any structure at all — 1503 triangles in a flat vector means every ray tests every one of them</text>

  <text class="dim" x="30" y="414">Loading is recursive; what comes out the other end is a list.</text>
</svg>

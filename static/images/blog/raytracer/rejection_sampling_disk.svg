  <text class="lbl big mono" x="430" y="118">do { p = 2·(ξ, ξ) − (1,1) }</text>
  <text class="lbl big mono" x="430" y="142">while (dot(p, p) &gt;= 1)</text>
  <circle cx="436" cy="186" r="4.2" fill="#34d399"/>
  <text class="lbl" x="454" y="191">inside the disk — kept</text>
  <path d="M432.5,210.5 l7,7 M439.5,210.5 l-7,7" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
  <text class="lbl" x="454" y="219">outside — discarded, drawn again</text>
  <text class="lbl dim" x="430" y="262">A square is trivial to sample uniformly.</text>
  <text class="lbl dim" x="430" y="280">A disk is not. So sample the square and</text>
  <text class="lbl dim" x="430" y="298">throw the corners away.</text>
  <text class="lbl mono" x="430" y="340" fill="#818cf8">π/4 ≈ 78.5% of draws survive</text>
  <text class="lbl dim" x="430" y="360">the loop runs 1.27 times on average</text>

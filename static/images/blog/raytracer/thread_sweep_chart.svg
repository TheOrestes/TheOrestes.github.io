<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Wall clock render time against samples per pixel, single threaded versus sixteen threads. Sixteen threads is slower at every sample count until about 45 samples, where the two lines cross.">
  <style>
    .ttl  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #e5e7eb; }
    .sub  { font-family: system-ui, sans-serif; font-size: 12px; fill: #9ca3af; }
    .ax   { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11.5px; fill: #9ca3af; }
    .lgd  { font-family: system-ui, sans-serif; font-size: 12.5px; fill: #d1d5db; }
    .note { font-family: system-ui, sans-serif; font-size: 12px; fill: #9ca3af; }
  </style>

  <text class="ttl" x="40" y="30">Render time against samples per pixel</text>
  <text class="sub" x="40" y="50">960 × 540, commit 7d1cdb1, 16-core machine — only maxNumThreads differs</text>

  <!-- grid -->
  <line x1="90" y1="340" x2="660" y2="340" stroke="#374151" stroke-width="1"/>
  <line x1="90" y1="270" x2="660" y2="270" stroke="#1f2937" stroke-width="1"/>
  <line x1="90" y1="200" x2="660" y2="200" stroke="#1f2937" stroke-width="1"/>
  <line x1="90" y1="130" x2="660" y2="130" stroke="#1f2937" stroke-width="1"/>
  <line x1="90" y1="60"  x2="660" y2="60"  stroke="#1f2937" stroke-width="1"/>
  <line x1="90" y1="60"  x2="90"  y2="340" stroke="#374151" stroke-width="1"/>

  <!-- y ticks -->
  <text class="ax" x="80" y="344" text-anchor="end">0</text>
  <text class="ax" x="80" y="274" text-anchor="end">3</text>
  <text class="ax" x="80" y="204" text-anchor="end">6</text>
  <text class="ax" x="80" y="134" text-anchor="end">9</text>
  <text class="ax" x="80" y="64"  text-anchor="end">12</text>
  <text class="sub" x="34" y="200" text-anchor="middle" transform="rotate(-90 34 200)">wall clock, seconds</text>

  <!-- x ticks -->
  <text class="ax" x="90"  y="362" text-anchor="middle">2</text>
  <text class="ax" x="200" y="362" text-anchor="middle">4</text>
  <text class="ax" x="310" y="362" text-anchor="middle">8</text>
  <text class="ax" x="420" y="362" text-anchor="middle">16</text>
  <text class="ax" x="530" y="362" text-anchor="middle">32</text>
  <text class="ax" x="640" y="362" text-anchor="middle">64</text>
  <text class="sub" x="375" y="390" text-anchor="middle">samples per pixel</text>

  <!-- crossover marker -->
  <line x1="583" y1="124" x2="583" y2="340" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="583" cy="124" r="4" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- 16 threads (orange) -->
  <polyline fill="none" stroke="#d95926" stroke-width="2"
            points="90,170 200,170 310,170 420,160 530,142 640,104"/>
  <circle cx="90"  cy="170" r="4.5" fill="#d95926" stroke="#070709" stroke-width="2"/>
  <circle cx="200" cy="170" r="4.5" fill="#d95926" stroke="#070709" stroke-width="2"/>
  <circle cx="310" cy="170" r="4.5" fill="#d95926" stroke="#070709" stroke-width="2"/>
  <circle cx="420" cy="160" r="4.5" fill="#d95926" stroke="#070709" stroke-width="2"/>
  <circle cx="530" cy="142" r="4.5" fill="#d95926" stroke="#070709" stroke-width="2"/>
  <circle cx="640" cy="104" r="4.5" fill="#d95926" stroke="#070709" stroke-width="2"/>

  <!-- 1 thread (blue) -->
  <polyline fill="none" stroke="#3987e5" stroke-width="2"
            points="90,268 200,261 310,247 420,219 530,167 640,76"/>
  <circle cx="90"  cy="268" r="4.5" fill="#3987e5" stroke="#070709" stroke-width="2"/>
  <circle cx="200" cy="261" r="4.5" fill="#3987e5" stroke="#070709" stroke-width="2"/>
  <circle cx="310" cy="247" r="4.5" fill="#3987e5" stroke="#070709" stroke-width="2"/>
  <circle cx="420" cy="219" r="4.5" fill="#3987e5" stroke="#070709" stroke-width="2"/>
  <circle cx="530" cy="167" r="4.5" fill="#3987e5" stroke="#070709" stroke-width="2"/>
  <circle cx="640" cy="76"  r="4.5" fill="#3987e5" stroke="#070709" stroke-width="2"/>

  <!-- direct labels: colored mark carries identity, text stays in ink -->
  <circle cx="666" cy="72" r="4.5" fill="#3987e5"/>
  <text class="lgd" x="676" y="76">1 thread</text>
  <circle cx="666" cy="108" r="4.5" fill="#d95926"/>
  <text class="lgd" x="676" y="112">16 threads</text>

  <!-- annotations -->
  <text class="note" x="150" y="206">sixteen threads is slower here</text>
  <text class="note" x="470" y="410">they cross at roughly 45 samples per pixel</text>

  <text class="note" x="40" y="428">1 thread ≈ 2.84s + 0.132s per sample   ·   16 threads ≈ 7.2s + 0.045s per sample</text>
</svg>

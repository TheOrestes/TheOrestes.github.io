<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="One level of the BVH build: triangles are sorted by centroid along the box's longest axis, split at the spatial midpoint, and each half gets its own box.">
  <defs>
    <marker id="bv-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <style>
    .ttl  { font-family: system-ui, sans-serif; font-size: 13px; fill: #c7d2fe; }
    .lbl  { font-family: system-ui, sans-serif; font-size: 12px; fill: #d1d5db; }
    .dim  { font-family: system-ui, sans-serif; font-size: 11.5px; fill: #9ca3af; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11.5px; }
    .tri  { stroke-width: 1.2; }
  </style>

  <text class="ttl" x="30" y="28">one level of the split</text>

  <rect x="40" y="52" width="300" height="150" fill="none" stroke="#818cf8" stroke-width="1.4"/>
  <text class="dim" x="40" y="46">the node's box</text>

  <g class="tri" fill="#3987e5" fill-opacity="0.30" stroke="#3987e5">
    <path d="M62,150 L82,150 L72,128 z"/>
    <path d="M92,182 L114,182 L103,160 z"/>
    <path d="M78,104 L100,104 L89,82 z"/>
    <path d="M124,142 L146,142 L135,120 z"/>
    <path d="M150,186 L170,186 L160,166 z"/>
  </g>
  <g class="tri" fill="#d95926" fill-opacity="0.30" stroke="#d95926">
    <path d="M212,120 L234,120 L223,98 z"/>
    <path d="M246,168 L268,168 L257,146 z"/>
    <path d="M280,132 L302,132 L291,110 z"/>
    <path d="M198,180 L218,180 L208,160 z"/>
    <path d="M300,182 L320,182 L310,162 z"/>
  </g>

  <line x1="190" y1="46" x2="190" y2="208" stroke="#e5e7eb" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="dim" x="150" y="228" fill="#e5e7eb">spatial midpoint</text>

  <line x1="40" y1="252" x2="340" y2="252" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#bv-r)"/>
  <text class="dim" x="40" y="270">longest axis of the box</text>

  <circle cx="72"  cy="252" r="3" fill="#3987e5"/>
  <circle cx="89"  cy="252" r="3" fill="#3987e5"/>
  <circle cx="103" cy="252" r="3" fill="#3987e5"/>
  <circle cx="135" cy="252" r="3" fill="#3987e5"/>
  <circle cx="160" cy="252" r="3" fill="#3987e5"/>
  <circle cx="208" cy="252" r="3" fill="#d95926"/>
  <circle cx="223" cy="252" r="3" fill="#d95926"/>
  <circle cx="257" cy="252" r="3" fill="#d95926"/>
  <circle cx="291" cy="252" r="3" fill="#d95926"/>
  <circle cx="310" cy="252" r="3" fill="#d95926"/>
  <line x1="190" y1="240" x2="190" y2="264" stroke="#e5e7eb" stroke-width="1.4" stroke-dasharray="3 3"/>

  <text class="dim" x="40" y="300">Sorting the triangles by centroid along that axis is what makes</text>
  <text class="dim" x="40" y="318">the split findable: everything left of the midpoint is already</text>
  <text class="dim" x="40" y="336">contiguous, so one scan for the first centroid past it gives an</text>
  <text class="dim" x="40" y="354">index, and the two halves are just two ranges of one array.</text>

  <rect x="52" y="378" width="118" height="46" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-width="1.4"/>
  <rect x="196" y="378" width="128" height="46" fill="#d95926" fill-opacity="0.12" stroke="#d95926" stroke-width="1.4"/>
  <text class="mono" x="66"  y="405" fill="#3987e5">left child box</text>
  <text class="mono" x="210" y="405" fill="#d95926">right child box</text>
  <text class="dim" x="40" y="448">Each half is then bounded on its own and the whole thing recurses.</text>

  <line x1="400" y1="20" x2="400" y2="450" stroke="#374151" stroke-width="1"/>

  <text class="ttl" x="430" y="28">the tree that comes out</text>

  <rect x="556" y="52" width="120" height="30" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-width="1.4"/>
  <text class="mono lbl" x="576" y="72">1503 tris</text>

  <line x1="596" y1="82" x2="536" y2="118" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="636" y1="82" x2="696" y2="118" stroke="#6b7280" stroke-width="1.2"/>

  <rect x="466" y="118" width="120" height="30" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-width="1.2"/>
  <rect x="646" y="118" width="120" height="30" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-width="1.2"/>
  <text class="mono lbl" x="492" y="138">~750</text>
  <text class="mono lbl" x="672" y="138">~750</text>

  <line x1="506" y1="148" x2="476" y2="184" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="546" y1="148" x2="576" y2="184" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="686" y1="148" x2="656" y2="184" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="726" y1="148" x2="756" y2="184" stroke="#6b7280" stroke-width="1.2"/>

  <g fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.3">
    <rect x="430" y="184" width="92" height="28"/>
    <rect x="532" y="184" width="92" height="28"/>
    <rect x="634" y="184" width="92" height="28"/>
  </g>
  <text class="mono" x="452" y="203" fill="#34d399">~188</text>
  <text class="mono" x="554" y="203" fill="#34d399">~188</text>
  <text class="mono" x="656" y="203" fill="#34d399">~188</text>
  <text class="dim" x="732" y="203">…</text>

  <text class="dim" x="430" y="240" fill="#34d399">leaves — where triangles actually live</text>

  <text class="mono dim" x="430" y="276">BuildBVHTree(&amp;m_vecTriangles, m_iTriangleCount / 8);</text>

  <text class="dim" x="430" y="308">A node stops splitting once it holds a eighth of the mesh or</text>
  <text class="dim" x="430" y="326">fewer, so the tree bottoms out about three levels down and</text>
  <text class="dim" x="430" y="344">each leaf still carries a couple of hundred triangles.</text>

  <text class="dim" x="430" y="378">A ray reaching a leaf tests all of them, so the win here is</text>
  <text class="dim" x="430" y="396">the eight-ish boxes it skipped on the way, not the log-depth</text>
  <text class="dim" x="430" y="414">descent a smaller leaf size would give. Somewhere to go next:</text>
  <text class="mono dim" x="430" y="440">m_iTriangleCount / 8  →  a small constant</text>
</svg>

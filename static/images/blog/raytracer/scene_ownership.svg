<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Three stages of ownership: free-floating globals, then two singletons, then a chain where Application owns Scene which owns the Camera and the geometry.">
  <defs>
    <marker id="so-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <style>
    .ttl  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #c7d2fe; }
    .sha  { font-family: ui-monospace, monospace; font-size: 11px; fill: #6b7280; }
    .box  { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 11.5px; fill: #e5e7eb; }
    .dim  { font-family: system-ui, sans-serif; font-size: 11.5px; fill: #9ca3af; }
    .cap  { font-family: system-ui, sans-serif; font-size: 12px; fill: #d1d5db; }
  </style>

  <!-- ============ 1: globals ============ -->
  <text class="ttl" x="30" y="34">free-floating</text>
  <text class="sha" x="30" y="50">before post 8</text>

  <rect x="30" y="70"  width="190" height="34" rx="3" fill="#f87171" fill-opacity="0.10" stroke="#f87171" stroke-width="1.2"/>
  <text class="box" x="42" y="92">Hitable* world</text>

  <rect x="30" y="116" width="190" height="34" rx="3" fill="#f87171" fill-opacity="0.10" stroke="#f87171" stroke-width="1.2"/>
  <text class="box" x="42" y="138">Camera cam</text>

  <rect x="30" y="162" width="190" height="48" rx="3" fill="#f87171" fill-opacity="0.06" stroke="#f87171" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="box" x="42" y="182">Hitable** list</text>
  <text class="box dim" x="42" y="200">+ a hand-counted size</text>

  <text class="dim" x="30" y="240">Three globals, constructed</text>
  <text class="dim" x="30" y="258">before main, owned by</text>
  <text class="dim" x="30" y="276">nobody in particular.</text>

  <!-- ============ 2: singletons ============ -->
  <text class="ttl" x="280" y="34">one of each</text>
  <text class="sha" x="280" y="50">ef07d36 · befe602</text>

  <rect x="280" y="70" width="190" height="96" rx="3" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="1.3"/>
  <text class="box" x="292" y="90">Scene::getInstance()</text>
  <rect x="292" y="102" width="166" height="52" rx="3" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="1"/>
  <text class="box" x="302" y="122">vector&lt;Hitable*&gt;</text>
  <text class="box dim" x="302" y="142">InitScene()</text>

  <rect x="280" y="178" width="190" height="34" rx="3" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="1.3"/>
  <text class="box" x="292" y="200">Camera::getInstance()</text>

  <text class="dim" x="280" y="240">The container has an owner</text>
  <text class="dim" x="280" y="258">now. Nothing owns the</text>
  <text class="dim" x="280" y="276">singletons themselves.</text>

  <!-- ============ 3: a chain ============ -->
  <text class="ttl" x="530" y="34">a chain</text>
  <text class="sha" x="530" y="50">01bee25</text>

  <rect x="530" y="70" width="200" height="142" rx="3" fill="#199e70" fill-opacity="0.10" stroke="#199e70" stroke-width="1.4"/>
  <text class="box" x="542" y="90">Application</text>

  <rect x="542" y="100" width="176" height="100" rx="3" fill="#199e70" fill-opacity="0.10" stroke="#199e70" stroke-width="1.1"/>
  <text class="box" x="552" y="120">Scene* m_pScene</text>

  <rect x="552" y="130" width="156" height="26" rx="3" fill="#199e70" fill-opacity="0.12" stroke="#199e70" stroke-width="1"/>
  <text class="box" x="560" y="147">Camera* m_pCamera</text>

  <rect x="552" y="162" width="156" height="26" rx="3" fill="#199e70" fill-opacity="0.12" stroke="#199e70" stroke-width="1"/>
  <text class="box" x="560" y="179">vector&lt;Hitable*&gt;</text>

  <text class="dim" x="530" y="240">Every arrow points one way,</text>
  <text class="dim" x="530" y="258">and something at the top</text>
  <text class="dim" x="530" y="276">is responsible.</text>

  <!-- arrows between stages -->
  <line x1="232" y1="140" x2="272" y2="140" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#so-a)"/>
  <line x1="482" y1="140" x2="522" y2="140" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#so-a)"/>

  <!-- footer -->
  <line x1="30" y1="316" x2="730" y2="316" stroke="#374151" stroke-width="1"/>
  <text class="cap" x="30" y="344">What did not change: every one of those Hitables is still a raw `new` that nobody deletes.</text>
  <text class="dim" x="30" y="372">Settling who owns the container is a different question from who owns the things inside it, and only the</text>
  <text class="dim" x="30" y="390">first one gets answered here. The vector knows how many there are and frees its own storage; the objects</text>
  <text class="dim" x="30" y="408">it points at outlive everything and get reclaimed by process exit.</text>
  <text class="dim" x="30" y="440">Also gone in the first commit: every method defined in a header moves into a .cpp, which is the</text>
  <text class="dim" x="30" y="458">one-definition-rule problem post 3 flagged and left on the list.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Left: a ray entering glass bends toward the normal, with a weak partial reflection. Right: inside the glass at too shallow an angle there is no refracted solution and the ray reflects back inside — total internal reflection">
  <defs>
    <marker id="rf-ray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/>
    </marker>
    <marker id="rf-weak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="rf-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>

  <style>
    .lbl  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; fill: #d1d5db; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
    .dim  { fill: #9ca3af; font-size: 12px; }
    .ttl  { font-size: 13.5px; fill: #c7d2fe; }
  </style>

  <!-- ================= panel A : refraction ================= -->
  <text class="lbl ttl" x="40" y="40">entering glass · discriminant &gt; 0</text>

  <rect x="40" y="210" width="320" height="118" fill="#818cf8" fill-opacity="0.10"/>
  <line x1="40" y1="210" x2="360" y2="210" stroke="#9ca3af" stroke-width="1.8"/>
  <line x1="200" y1="118" x2="200" y2="322" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>

  <text class="lbl mono dim" x="286" y="196">n₁ = 1.0</text>
  <text class="lbl mono" x="286" y="234" fill="#818cf8">n₂ = 1.5</text>

  <!-- incident -->
  <line x1="120" y1="130" x2="196" y2="206" stroke="#e5e7eb" stroke-width="1.7" marker-end="url(#rf-ray)"/>
  <path d="M182,152 A 46 46 0 0 1 200,164" fill="none" stroke="#9ca3af" stroke-width="1.1"/>
  <text class="lbl mono dim" x="168" y="176">θ₁</text>

  <!-- refracted, bent toward the normal -->
  <line x1="200" y1="210" x2="254" y2="311" stroke="#e5e7eb" stroke-width="1.7" marker-end="url(#rf-ray)"/>
  <path d="M200,266 A 56 56 0 0 0 226,261" fill="none" stroke="#9ca3af" stroke-width="1.1"/>
  <text class="lbl mono dim" x="206" y="286">θ₂</text>
  <text class="lbl dim" x="258" y="330">bends toward the normal</text>

  <!-- weak partial reflection -->
  <line x1="200" y1="210" x2="264" y2="146" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#rf-weak)"/>
  <text class="lbl dim" x="252" y="132">~4% reflects</text>

  <circle cx="200" cy="210" r="4.5" fill="#e5e7eb"/>

  <!-- ================= panel B : total internal reflection ================= -->
  <text class="lbl ttl" x="400" y="40">leaving too shallow · discriminant &lt; 0</text>

  <rect x="400" y="210" width="320" height="118" fill="#818cf8" fill-opacity="0.10"/>
  <line x1="400" y1="210" x2="720" y2="210" stroke="#9ca3af" stroke-width="1.8"/>
  <line x1="560" y1="118" x2="560" y2="322" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>

  <text class="lbl mono dim" x="676" y="152">n₂ = 1.0</text>
  <text class="lbl mono" x="640" y="234" fill="#818cf8">n₁ = 1.5</text>

  <!-- incident from inside the glass -->
  <line x1="424" y1="288" x2="556" y2="212" stroke="#e5e7eb" stroke-width="1.7" marker-end="url(#rf-ray)"/>
  <path d="M512,238 A 56 56 0 0 0 560,266" fill="none" stroke="#9ca3af" stroke-width="1.1"/>
  <text class="lbl mono dim" x="500" y="272">θ₁ &gt; θc</text>

  <!-- no refracted ray -->
  <line x1="560" y1="210" x2="626" y2="192" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/>
  <path d="M628,186 l12,12 M640,186 l-12,12" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
  <text class="lbl dim" x="566" y="176" fill="#f87171">no refracted ray</text>

  <!-- reflected back inside -->
  <line x1="560" y1="210" x2="692" y2="286" stroke="#f87171" stroke-width="1.7" marker-end="url(#rf-red)"/>
  <text class="lbl dim" x="600" y="308" fill="#f87171">all of it reflects, back inside</text>

  <circle cx="560" cy="210" r="4.5" fill="#e5e7eb"/>

  <!-- ================= notes ================= -->
  <text class="lbl mono" x="40" y="372" fill="#818cf8">1 − (n₁/n₂)² (1 − (v̂·n)²)</text>
  <text class="lbl dim"  x="40" y="392">the same "is there a real root" question the ray-sphere test asked, about something else entirely</text>
  <text class="lbl dim"  x="40" y="414">when it goes negative Refract() returns false, reflect_prob is set to 1, and the coin flip can only land one way</text>
</svg>

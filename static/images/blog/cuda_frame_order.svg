<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-label="One frame in order: the CUDA image is blitted to the window, the BVH wireframe is drawn over it, the ImGui panel is drawn on top, then the buffers are swapped.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
.ax{stroke:#6b7280;stroke-width:1.2;fill:none}
.grid{stroke:#374151;stroke-width:1;fill:none}
.dash{stroke:#9ca3af;stroke-width:1;stroke-dasharray:4 3;fill:none}
</style>
<text class="ttl" x="20" y="24" text-anchor="start">One frame, in drawing order</text>
<rect x="20" y="44" width="130" height="56" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="85.0" y="68.5" text-anchor="middle">CUDA kernel</text>
<text class="lbl" x="85.0" y="83.5" text-anchor="middle">writes the image</text>
<line x1="152" y1="72" x2="160" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="163" y="44" width="130" height="56" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="228.0" y="68.5" text-anchor="middle">blit to the</text>
<text class="lbl" x="228.0" y="83.5" text-anchor="middle">window</text>
<line x1="295" y1="72" x2="303" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="306" y="44" width="130" height="56" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="371.0" y="68.5" text-anchor="middle">BVH wireframe</text>
<text class="lbl" x="371.0" y="83.5" text-anchor="middle">overlay</text>
<line x1="438" y1="72" x2="446" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="449" y="44" width="130" height="56" rx="6" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.4"/>
<text class="lbl" x="514.0" y="68.5" text-anchor="middle">ImGui</text>
<text class="lbl" x="514.0" y="83.5" text-anchor="middle">controls</text>
<line x1="581" y1="72" x2="589" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="592" y="44" width="130" height="56" rx="6" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="657.0" y="68.5" text-anchor="middle">glfwSwapBuffers</text>
<text class="lbl" x="657.0" y="83.5" text-anchor="middle">show the frame</text>
<text class="lbl" x="380" y="134" text-anchor="middle">Later boxes are drawn on top of earlier ones.</text>
<text class="dim" x="380" y="154" text-anchor="middle">The wireframe is drawn without depth testing, so it never hides behind the image.</text>
</svg>

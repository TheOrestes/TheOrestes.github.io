<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="An equirectangular texture maps u to azimuth and v to elevation; each texel corresponds to one unit direction on the sphere.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;fill:#e5e7eb}
.ax{stroke:#6b7280;stroke-width:1.2;fill:none}
.grid{stroke:#374151;stroke-width:1;fill:none}
.dash{stroke:#9ca3af;stroke-width:1;stroke-dasharray:4 3;fill:none}
</style>
<text class="ttl" x="20.0" y="24.0" text-anchor="start">One texel of the equirectangular sky is one direction on the sphere</text>
<rect x="60" y="50" width="380" height="200" fill="none" stroke="#6b7280"/>
<line class="dash" x1="60.0" y1="150.0" x2="440.0" y2="150.0"/>
<line class="dash" x1="250.0" y1="50.0" x2="250.0" y2="250.0"/>
<text class="dim" x="60.0" y="266.0" text-anchor="start">u = 0</text>
<text class="dim" x="440.0" y="266.0" text-anchor="end">u = 1</text>
<text class="dim" x="250.0" y="266.0" text-anchor="middle">u = 0.5</text>
<text class="lbl" x="250.0" y="286.0" text-anchor="middle">azimuth  a = (u - 0.5) * 2*pi   (-pi ... +pi)</text>
<text class="dim" x="54.0" y="250.0" text-anchor="end">v = 0</text>
<text class="dim" x="54.0" y="60.0" text-anchor="end">v = 1</text>
<text class="dim" x="54.0" y="154.0" text-anchor="end">0.5</text>
<text class="dim" x="66.0" y="64.0" text-anchor="start">zenith (e = +pi/2)</text>
<text class="dim" x="66.0" y="244.0" text-anchor="start">nadir (e = -pi/2)</text>
<text class="dim" x="434.0" y="144.0" text-anchor="end">horizon (e = 0)</text>
<line class="dash" x1="303.2" y1="250.0" x2="303.2" y2="114.0"/>
<line class="dash" x1="60.0" y1="114.0" x2="303.2" y2="114.0"/>
<circle cx="303.2" cy="114.0" r="5" fill="#fbbf24"/>
<text class="mono" x="312.2" y="106.0" text-anchor="start">(u, v)</text>
<text class="lbl" x="250.0" y="306.0" text-anchor="middle">elevation  e = (v - 0.5) * pi</text>

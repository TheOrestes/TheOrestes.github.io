<line class="ax" x1="620.0" y1="140.0" x2="561.6" y2="182.5" marker-end="url(#a)"/>
<text class="dim" x="567.6" y="186.5" text-anchor="start">+X</text>
<line class="ax" x1="620.0" y1="140.0" x2="620.0" y2="33.8" marker-end="url(#a)"/>
<text class="dim" x="626.0" y="37.8" text-anchor="start">+Y</text>
<line class="ax" x1="620.0" y1="140.0" x2="720.9" y2="150.6" marker-end="url(#a)"/>
<text class="dim" x="726.9" y="154.6" text-anchor="start">+Z</text>
<line class="dash" x1="620.0" y1="140.0" x2="651.8" y2="168.4"/>
<line class="dash" x1="646.1" y1="114.5" x2="651.8" y2="168.4"/>
<line class="ax" style="stroke:#fbbf24" x1="620.0" y1="140.0" x2="646.1" y2="114.5" marker-end="url(#a)"/>
<circle cx="646.1" cy="114.5" r="4" fill="#fbbf24"/>
<text class="mono" x="654.1" y="110.5" text-anchor="start">dir</text>
<text class="mono" x="657.8" y="182.4" text-anchor="start">a</text>
<text class="mono" x="628.1" y="141.4" text-anchor="start">e</text>
<text class="mono" x="620.0" y="262.0" text-anchor="middle">dir = ( cos e * cos a,</text>
<text class="mono" x="620.0" y="280.0" text-anchor="middle">sin e,  cos e * sin a )</text>
</svg>

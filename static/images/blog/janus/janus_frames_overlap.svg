<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="Two frames in flight: the CPU records frame N+1 while the GPU runs frame N. Frame 2 starts recording once the GPU has finished frame 0, which shares its slot." font-family="Space Grotesk, Inter, sans-serif">
<defs>
<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
</defs>
<text x="20" y="76" fill="#c7d2fe" font-size="14" font-weight="700">CPU</text>
<text x="20" y="166" fill="#c7d2fe" font-size="14" font-weight="700">GPU</text>
<g font-size="13" text-anchor="middle" fill="#e5e7eb">
<rect x="150" y="50" width="110" height="40" rx="6" fill="#1e2a44" stroke="#60a5fa"/><text x="205" y="75">Record 0</text>
<rect x="270" y="50" width="110" height="40" rx="6" fill="#2a2140" stroke="#a78bfa"/><text x="325" y="75">Record 1</text>
<rect x="390" y="50" width="110" height="40" rx="6" fill="#1e2a44" stroke="#60a5fa"/><text x="445" y="75">Record 2</text>
<rect x="510" y="50" width="110" height="40" rx="6" fill="#2a2140" stroke="#a78bfa"/><text x="565" y="75">Record 3</text>
<rect x="270" y="140" width="110" height="40" rx="6" fill="#1e2a44" stroke="#60a5fa"/><text x="325" y="165">Run 0</text>
<rect x="390" y="140" width="110" height="40" rx="6" fill="#2a2140" stroke="#a78bfa"/><text x="445" y="165">Run 1</text>
<rect x="510" y="140" width="110" height="40" rx="6" fill="#1e2a44" stroke="#60a5fa"/><text x="565" y="165">Run 2</text>
<rect x="630" y="140" width="110" height="40" rx="6" fill="#2a2140" stroke="#a78bfa"/><text x="685" y="165">Run 3</text>
</g>
<g stroke="#9ca3af" stroke-width="1.3" fill="none" marker-end="url(#ah2)">
<path d="M258,92 L272,138"/><path d="M378,92 L392,138"/><path d="M498,92 L512,138"/><path d="M618,92 L632,138"/>
</g>
<text x="265" y="120" fill="#9ca3af" font-size="11" text-anchor="end">submit</text>
<line x1="385" y1="40" x2="385" y2="192" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="150" y="30" fill="#9ca3af" font-size="12"><tspan fill="#60a5fa">■</tspan> slot 0 (tray A)</text>
<text x="290" y="30" fill="#9ca3af" font-size="12"><tspan fill="#a78bfa">■</tspan> slot 1 (tray B)</text>
<text x="390" y="215" text-anchor="middle" fill="#fbbf24" font-size="12">Record 2 reuses tray A, so it starts only once Run 0 is done (fence ≥ 1)</text>
</svg>
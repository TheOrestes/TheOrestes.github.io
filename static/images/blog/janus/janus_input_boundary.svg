<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-label="Input boundary: a W key press is a GLFW key code inside Input.cpp, which maps it to InputAction::MoveForward. Everything above the boundary only ever sees the action.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
</style>
<text class="ttl" x="20" y="24">Where GLFW stops</text>
<rect x="20" y="44" width="150" height="56" rx="6" fill="#9ca3af" fill-opacity="0.12" stroke="#9ca3af" stroke-width="1.4"/>
<text class="lbl" x="95" y="68" text-anchor="middle">Keyboard</text>
<text class="dim" x="95" y="86" text-anchor="middle">W is down</text>
<line x1="172" y1="72" x2="188" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="191" y="44" width="170" height="56" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="mono" x="276" y="68" text-anchor="middle">GLFW_KEY_W</text>
<text class="dim" x="276" y="86" text-anchor="middle">glfwGetKey</text>
<line x1="363" y1="72" x2="379" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="382" y="44" width="150" height="56" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="mono" x="457" y="68" text-anchor="middle">ToKey()</text>
<text class="dim" x="457" y="86" text-anchor="middle">Input.cpp, static</text>
<line x1="534" y1="72" x2="550" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="553" y="44" width="187" height="56" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="mono" x="646" y="68" text-anchor="middle">InputAction::MoveForward</text>
<text class="dim" x="646" y="86" text-anchor="middle">what the rest of Janus sees</text>
<line x1="540" y1="30" x2="540" y2="116" stroke="#f87171" stroke-width="1.4" stroke-dasharray="4 3"/>
<text class="lbl" x="380" y="146" text-anchor="middle">Everything left of the red line knows about GLFW. Everything right of it does not.</text>
<text class="dim" x="380" y="166" text-anchor="middle">Swapping GLFW for something else later means rewriting one function.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="Three named loggers, JANUS, APP and D3D12, share two sinks: a coloured console and a plain janus.log file. The D3D12 debug layer messages enter through the D3D12 logger.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
</style>
<text class="ttl" x="20" y="24">Three voices, two destinations</text>
<rect x="20" y="44" width="130" height="36" rx="5" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-width="1.4"/><text class="mono" x="85" y="67" text-anchor="middle">JANUS</text>
<rect x="20" y="92" width="130" height="36" rx="5" fill="#f0abfc" fill-opacity="0.14" stroke="#f0abfc" stroke-width="1.4"/><text class="mono" x="85" y="115" text-anchor="middle">APP</text>
<rect x="20" y="140" width="130" height="36" rx="5" fill="#fb923c" fill-opacity="0.14" stroke="#fb923c" stroke-width="1.4"/><text class="mono" x="85" y="163" text-anchor="middle">D3D12</text>
<line x1="152" y1="62" x2="318" y2="88" stroke="#e5e7eb" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="152" y1="110" x2="318" y2="100" stroke="#e5e7eb" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="152" y1="158" x2="318" y2="112" stroke="#e5e7eb" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="320" y="60" width="150" height="80" rx="6" fill="#9ca3af" fill-opacity="0.12" stroke="#9ca3af" stroke-width="1.4"/><text class="lbl" x="395" y="96" text-anchor="middle">same two sinks</text><text class="dim" x="395" y="114" text-anchor="middle">shared by all three</text>
<line x1="472" y1="84" x2="548" y2="62" stroke="#e5e7eb" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="472" y1="116" x2="548" y2="140" stroke="#e5e7eb" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="550" y="40" width="190" height="46" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/><text class="lbl" x="645" y="60" text-anchor="middle">console</text><text class="dim" x="645" y="76" text-anchor="middle">colour codes on</text>
<rect x="550" y="120" width="190" height="46" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/><text class="lbl" x="645" y="140" text-anchor="middle">janus.log</text><text class="dim" x="645" y="156" text-anchor="middle">plain text, wiped each run</text>
<text class="dim" x="380" y="196" text-anchor="middle">The D3D12 debug layer talks through the D3D12 logger, so its complaints land in the same two places.</text>
</svg>

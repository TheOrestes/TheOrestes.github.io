<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="D3D12 bring-up order: enable the debug layer, create the DXGI factory with the debug flag, pick the high performance adapter, create the device at feature level 12.0, then set break on error. A note says the debug layer must come before device creation.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
</style>
<text class="ttl" x="20" y="24">Core::Init(), in order</text>
<rect x="20" y="44" width="126" height="64" rx="6" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="83" y="70" text-anchor="middle">Debug layer</text>
<text class="dim" x="83" y="90" text-anchor="middle">+ GPU validation</text>
<line x1="148" y1="76" x2="160" y2="76" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="163" y="44" width="126" height="64" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="226" y="70" text-anchor="middle">DXGI factory</text>
<text class="dim" x="226" y="90" text-anchor="middle">debug flag on</text>
<line x1="291" y1="76" x2="303" y2="76" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="306" y="44" width="126" height="64" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="369" y="70" text-anchor="middle">Pick adapter</text>
<text class="dim" x="369" y="90" text-anchor="middle">high performance</text>
<line x1="434" y1="76" x2="446" y2="76" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="449" y="44" width="126" height="64" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="512" y="70" text-anchor="middle">Create device</text>
<text class="dim" x="512" y="90" text-anchor="middle">feature level 12_0</text>
<line x1="577" y1="76" x2="589" y2="76" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="592" y="44" width="148" height="64" rx="6" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.4"/>
<text class="lbl" x="666" y="70" text-anchor="middle">Break on error</text>
<text class="dim" x="666" y="90" text-anchor="middle">ERROR + CORRUPTION</text>
<text class="lbl" x="380" y="148" text-anchor="middle">The debug layer has to exist before the device does.</text>
<text class="dim" x="380" y="168" text-anchor="middle">Turn it on after D3D12CreateDevice and the runtime removes the device.</text>
<text class="dim" x="380" y="188" text-anchor="middle">Shutdown runs the other way: report live objects first, then release.</text>
</svg>

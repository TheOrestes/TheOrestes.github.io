<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="The display path: a CUDA kernel writes through a surface object into a shared texture, the texture is attached to a framebuffer object, and a blit copies it to the window's default framebuffer.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
.ax{stroke:#6b7280;stroke-width:1.2;fill:none}
.grid{stroke:#374151;stroke-width:1;fill:none}
.dash{stroke:#9ca3af;stroke-width:1;stroke-dasharray:4 3;fill:none}
</style>
<text class="ttl" x="20" y="24" text-anchor="start">From a CUDA thread to the window</text>
<rect x="20" y="44" width="105" height="56" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="72.5" y="68.5" text-anchor="middle">RayTracer</text>
<text class="lbl" x="72.5" y="83.5" text-anchor="middle">kernel</text>
<line x1="127" y1="72" x2="140" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="143" y="44" width="105" height="56" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="195.5" y="68.5" text-anchor="middle">surf2Dwrite</text>
<text class="lbl" x="195.5" y="83.5" text-anchor="middle">into surface</text>
<line x1="250" y1="72" x2="263" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="266" y="44" width="105" height="56" rx="6" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.4"/>
<text class="lbl" x="318.5" y="68.5" text-anchor="middle">shared GL</text>
<text class="lbl" x="318.5" y="83.5" text-anchor="middle">texture</text>
<line x1="373" y1="72" x2="386" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="389" y="44" width="105" height="56" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="441.5" y="68.5" text-anchor="middle">FBO, texture</text>
<text class="lbl" x="441.5" y="83.5" text-anchor="middle">as read source</text>
<line x1="496" y1="72" x2="509" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="512" y="44" width="105" height="56" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="564.5" y="68.5" text-anchor="middle">glBlitFramebuffer</text>
<text class="lbl" x="564.5" y="83.5" text-anchor="middle">copy pixels</text>
<line x1="619" y1="72" x2="632" y2="72" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="635" y="44" width="105" height="56" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="687.5" y="68.5" text-anchor="middle">default</text>
<text class="lbl" x="687.5" y="83.5" text-anchor="middle">framebuffer</text>
<text class="dim" x="72" y="120" text-anchor="middle" fill="#34d399">CUDA side</text>
<text class="dim" x="318" y="120" text-anchor="middle" fill="#a78bfa">shared memory</text>
<text class="dim" x="565" y="120" text-anchor="middle" fill="#60a5fa">OpenGL side, no geometry drawn</text>
<rect x="20" y="150" width="720" height="118" rx="6" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 3"/>
<text class="ttl" x="36" y="172" text-anchor="start">What RunRayTracingKernel does around the launch, every frame</text>
<rect x="36" y="190" width="105" height="44" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="88.5" y="208.5" text-anchor="middle">map</text>
<text class="lbl" x="88.5" y="223.5" text-anchor="middle">the resource</text>
<line x1="143" y1="212" x2="150" y2="212" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="153" y="190" width="105" height="44" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="205.5" y="208.5" text-anchor="middle">get</text>
<text class="lbl" x="205.5" y="223.5" text-anchor="middle">the CUDA array</text>
<line x1="260" y1="212" x2="267" y2="212" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="270" y="190" width="105" height="44" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="322.5" y="208.5" text-anchor="middle">create</text>
<text class="lbl" x="322.5" y="223.5" text-anchor="middle">a surface object</text>
<line x1="377" y1="212" x2="384" y2="212" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="387" y="190" width="105" height="44" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="439.5" y="208.5" text-anchor="middle">launch</text>
<text class="lbl" x="439.5" y="223.5" text-anchor="middle">the kernel</text>
<line x1="494" y1="212" x2="501" y2="212" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="504" y="190" width="105" height="44" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="556.5" y="208.5" text-anchor="middle">destroy</text>
<text class="lbl" x="556.5" y="223.5" text-anchor="middle">the surface</text>
<line x1="611" y1="212" x2="618" y2="212" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="621" y="190" width="105" height="44" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="673.5" y="208.5" text-anchor="middle">unmap</text>
<text class="lbl" x="673.5" y="223.5" text-anchor="middle">the resource</text>
<text class="dim" x="380" y="256" text-anchor="middle">the kernel only runs while the texture is mapped</text>
</svg>

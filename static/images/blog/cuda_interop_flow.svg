<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Two ways to show a CUDA image: the detour through CPU memory, and the interop path where CUDA writes straight into an OpenGL texture between a map and an unmap call.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
.ax{stroke:#6b7280;stroke-width:1.2;fill:none}
.grid{stroke:#374151;stroke-width:1;fill:none}
.dash{stroke:#9ca3af;stroke-width:1;stroke-dasharray:4 3;fill:none}
</style>
<text class="ttl" x="20" y="24" text-anchor="start">Without interop: the frame takes a detour through the CPU</text>
<rect x="20" y="40" width="120" height="52" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="80.0" y="62.5" text-anchor="middle">CUDA kernel</text>
<text class="lbl" x="80.0" y="77.5" text-anchor="middle">renders</text>
<line x1="142" y1="66" x2="167" y2="66" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="170" y="40" width="120" height="52" rx="6" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="230.0" y="62.5" text-anchor="middle">copy GPU to</text>
<text class="lbl" x="230.0" y="77.5" text-anchor="middle">CPU memory</text>
<line x1="292" y1="66" x2="317" y2="66" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="320" y="40" width="120" height="52" rx="6" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="380.0" y="62.5" text-anchor="middle">image sits in</text>
<text class="lbl" x="380.0" y="77.5" text-anchor="middle">system RAM</text>
<line x1="442" y1="66" x2="467" y2="66" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="470" y="40" width="120" height="52" rx="6" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-width="1.4"/>
<text class="lbl" x="530.0" y="62.5" text-anchor="middle">upload to a</text>
<text class="lbl" x="530.0" y="77.5" text-anchor="middle">GL texture</text>
<line x1="592" y1="66" x2="617" y2="66" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="620" y="40" width="120" height="52" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="680.0" y="62.5" text-anchor="middle">OpenGL</text>
<text class="lbl" x="680.0" y="77.5" text-anchor="middle">draws it</text>
<text class="dim" x="380" y="112" text-anchor="middle" fill="#f87171">two extra trips across the bus, every frame</text>
<text class="ttl" x="20" y="160" text-anchor="start">With interop: one GL texture, handed back and forth</text>
<rect x="20" y="176" width="105" height="52" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="72.5" y="198.5" text-anchor="middle">glTexture</text>
<text class="lbl" x="72.5" y="213.5" text-anchor="middle">created by GL</text>
<line x1="127" y1="202" x2="140" y2="202" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="143" y="176" width="105" height="52" rx="6" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.4"/>
<text class="lbl" x="195.5" y="198.5" text-anchor="middle">register with</text>
<text class="lbl" x="195.5" y="213.5" text-anchor="middle">CUDA (once)</text>
<line x1="250" y1="202" x2="263" y2="202" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="266" y="176" width="105" height="52" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="318.5" y="198.5" text-anchor="middle">map</text>
<text class="lbl" x="318.5" y="213.5" text-anchor="middle">resource</text>
<line x1="373" y1="202" x2="386" y2="202" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="389" y="176" width="105" height="52" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="441.5" y="198.5" text-anchor="middle">kernel writes</text>
<text class="lbl" x="441.5" y="213.5" text-anchor="middle">pixels</text>
<line x1="496" y1="202" x2="509" y2="202" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="512" y="176" width="105" height="52" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="564.5" y="198.5" text-anchor="middle">unmap</text>
<text class="lbl" x="564.5" y="213.5" text-anchor="middle">resource</text>
<line x1="619" y1="202" x2="632" y2="202" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="635" y="176" width="105" height="52" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="687.5" y="198.5" text-anchor="middle">GL draws a</text>
<text class="lbl" x="687.5" y="213.5" text-anchor="middle">fullscreen quad</text>
<line x1="20" y1="246" x2="248" y2="246" stroke="#60a5fa" stroke-width="2"/>
<text class="dim" x="134.0" y="264" text-anchor="middle" fill="#60a5fa">OpenGL owns it</text>
<line x1="266" y1="246" x2="617" y2="246" stroke="#34d399" stroke-width="2"/>
<text class="dim" x="441.5" y="264" text-anchor="middle" fill="#34d399">CUDA owns the texture only between map and unmap</text>
<line x1="635" y1="246" x2="740" y2="246" stroke="#60a5fa" stroke-width="2"/>
<text class="dim" x="687.5" y="264" text-anchor="middle" fill="#60a5fa">OpenGL owns it</text>
</svg>

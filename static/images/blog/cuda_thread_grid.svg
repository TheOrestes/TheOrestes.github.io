<text class="dim" x="150.0" y="252" text-anchor="middle">image, one cell per pixel</text>
<text class="dim" x="150.0" y="268" text-anchor="middle" fill="#a78bfa">purple boxes: blocks of threads tiling the image</text>
<text class="dim" x="195" y="42" text-anchor="middle" fill="#34d399">this thread: x = 5, y = 2</text>
<text class="lbl" x="300" y="70" text-anchor="start">each thread works out its own pixel</text>
<text class="mono" x="300" y="92" text-anchor="start">u = x / width</text>
<text class="mono" x="300" y="110" text-anchor="start">v = y / height</text>
<text class="lbl" x="300" y="130" text-anchor="start">and then writes exactly that pixel.</text>
<text class="ttl" x="300" y="190" text-anchor="start">surf2Dwrite takes a horizontal offset in bytes</text>
<rect x="300" y="206" width="105" height="40" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="352" y="223" text-anchor="middle">pixel x = 0</text>
<text class="dim" x="352" y="239" text-anchor="middle">16 bytes</text>
<text class="mono" x="302" y="264" text-anchor="start">byte 0</text>
<rect x="405" y="206" width="105" height="40" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="457" y="223" text-anchor="middle">pixel x = 1</text>
<text class="dim" x="457" y="239" text-anchor="middle">16 bytes</text>
<text class="mono" x="407" y="264" text-anchor="start">byte 16</text>
<rect x="510" y="206" width="105" height="40" rx="3" fill="#60a5fa" fill-opacity="0.4" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="562" y="223" text-anchor="middle">pixel x = 2</text>
<text class="dim" x="562" y="239" text-anchor="middle">16 bytes</text>
<text class="mono" x="512" y="264" text-anchor="start">byte 32</text>
<rect x="615" y="206" width="105" height="40" rx="3" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="667" y="223" text-anchor="middle">pixel x = 3</text>
<text class="dim" x="667" y="239" text-anchor="middle">16 bytes</text>
<text class="mono" x="617" y="264" text-anchor="start">byte 48</text>
<text class="dim" x="300" y="292" text-anchor="start">a float4 is 4 floats of 4 bytes. Pass x and you land inside pixel x/16.</text>
<text class="dim" x="300" y="308" text-anchor="start">Pass x * sizeof(float4) and you land on pixel x.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Left: a pixel's u and v pick a point on the image plane and the camera ray runs through it. Right: the miss color blends white to sky blue by the ray's vertical direction.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
.ax{stroke:#6b7280;stroke-width:1.2;fill:none}
.grid{stroke:#374151;stroke-width:1;fill:none}
.dash{stroke:#9ca3af;stroke-width:1;stroke-dasharray:4 3;fill:none}
</style>
<text class="ttl" x="20" y="24" text-anchor="start">Pixel to ray</text>
<polygon points="170,70 330,90 330,250 170,270" fill="#60a5fa" fill-opacity="0.10" stroke="#60a5fa" stroke-width="1.4"/>
<circle cx="60" cy="170" r="5" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.4"/>
<text class="dim" x="60" y="194" text-anchor="middle" fill="#fbbf24">camera</text>
<circle cx="274.0" cy="152.60000000000002" r="4" fill="#34d399" stroke="#34d399" stroke-width="1.4"/>
<line x1="60" y1="170" x2="274.0" y2="152.60000000000002" stroke="#34d399" stroke-width="1.8"/>
<line x1="274.0" y1="152.60000000000002" x2="420" y2="140.72897196261687" stroke="#34d399" stroke-width="1.8" marker-end="url(#a)"/>
<text class="lbl" x="335" y="140" text-anchor="middle" fill="#34d399">ray</text>
<text class="dim" x="268.0" y="174.60000000000002" text-anchor="end" fill="#34d399">pixel (u, v)</text>
<text class="dim" x="170" y="292" text-anchor="start">u: 0 at the left edge,</text>
<text class="dim" x="170" y="307" text-anchor="start">1 at the right edge</text>
<text class="dim" x="340" y="292" text-anchor="start">v: 0 at the bottom,</text>
<text class="dim" x="340" y="307" text-anchor="start">1 at the top</text>
<text class="ttl" x="470" y="24" text-anchor="start">Sky color by ray direction (GetMissColor)</text>
<defs><linearGradient id="sky" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#80b2ff"/></linearGradient></defs>
<rect x="480" y="50" width="60" height="230" rx="2" fill="url(#sky)" stroke="#9ca3af" stroke-width="1"/>
<line x1="540" y1="280" x2="556" y2="280" stroke="#9ca3af" stroke-width="1"/>
<text class="lbl" x="562" y="284" text-anchor="start">pointing straight down</text>
<text class="dim" x="562" y="299" text-anchor="start">t = 0.0, white</text>
<line x1="540" y1="165" x2="556" y2="165" stroke="#9ca3af" stroke-width="1"/>
<text class="lbl" x="562" y="169" text-anchor="start">level with the horizon</text>
<text class="dim" x="562" y="184" text-anchor="start">t = 0.5, half and half</text>
<line x1="540" y1="50" x2="556" y2="50" stroke="#9ca3af" stroke-width="1"/>
<text class="lbl" x="562" y="54" text-anchor="start">pointing straight up</text>
<text class="dim" x="562" y="69" text-anchor="start">t = 1.0, full sky blue</text>
<text class="dim" x="480" y="338" text-anchor="start">t = 0.5 * (direction.y + 1), then blend white to blue by t</text>
</svg>

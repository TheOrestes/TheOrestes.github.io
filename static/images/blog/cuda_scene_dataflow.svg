<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Scene data flow: the host builds a list of scene objects and a list of materials and passes both to the kernel. A hit reports a MaterialID, and the material table decides how the ray scatters.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
.ax{stroke:#6b7280;stroke-width:1.2;fill:none}
.grid{stroke:#374151;stroke-width:1;fill:none}
.dash{stroke:#9ca3af;stroke-width:1;stroke-dasharray:4 3;fill:none}
</style>
<rect x="20" y="40" width="220" height="340" rx="6" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 3"/>
<text class="ttl" x="36" y="62" text-anchor="start">Host (SetupScene)</text>
<rect x="36" y="76" width="188" height="96" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="mono" x="130.0" y="105.5" text-anchor="middle">SceneObject[]</text>
<text class="lbl" x="130.0" y="120.5" text-anchor="middle">type: SPHERE or MESH</text>
<text class="lbl" x="130.0" y="135.5" text-anchor="middle">MaterialID: 0, 1, ...</text>
<text class="lbl" x="130.0" y="150.5" text-anchor="middle">sphere or triangle data</text>
<rect x="36" y="200" width="188" height="96" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="mono" x="130.0" y="237.0" text-anchor="middle">Material[]</text>
<text class="lbl" x="130.0" y="252.0" text-anchor="middle">type, Albedo,</text>
<text class="lbl" x="130.0" y="267.0" text-anchor="middle">Fuzz, IoR</text>
<text class="dim" x="130" y="330" text-anchor="middle">two lists, handed to</text>
<text class="dim" x="130" y="346" text-anchor="middle">RunRayTracingKernel</text>
<line x1="226" y1="124" x2="296" y2="124" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="226" y1="248" x2="296" y2="248" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<text class="mono" x="262" y="116" text-anchor="middle">pObjects</text>
<text class="mono" x="262" y="240" text-anchor="middle">pMaterials</text>
<rect x="300" y="40" width="440" height="340" rx="6" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 3"/>
<text class="ttl" x="316" y="62" text-anchor="start">Device (RayTracer kernel, per bounce)</text>
<rect x="316" y="76" width="190" height="50" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="411.0" y="97.5" text-anchor="middle">HitWorld</text>
<text class="lbl" x="411.0" y="112.5" text-anchor="middle">loop over all objects</text>
<rect x="316" y="150" width="190" height="50" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="411.0" y="171.5" text-anchor="middle">HitObject</text>
<text class="lbl" x="411.0" y="186.5" text-anchor="middle">switch on obj.type</text>
<rect x="540" y="150" width="180" height="50" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="630.0" y="171.5" text-anchor="middle">HitSphere</text>
<text class="lbl" x="630.0" y="186.5" text-anchor="middle">(mesh: placeholder)</text>
<rect x="316" y="224" width="190" height="64" rx="6" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.4"/>
<text class="mono" x="411.0" y="245.0" text-anchor="middle">HitRecord</text>
<text class="lbl" x="411.0" y="260.0" text-anchor="middle">t, P, Normal, UV,</text>
<text class="lbl" x="411.0" y="275.0" text-anchor="middle">MaterialID</text>
<rect x="540" y="224" width="180" height="64" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="mono" x="630.0" y="252.5" text-anchor="middle">pMaterials[</text>
<text class="lbl" x="630.0" y="267.5" text-anchor="middle">rec.MaterialID]</text>
<rect x="540" y="312" width="180" height="54" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="630.0" y="328.0" text-anchor="middle">switch material.type</text>
<text class="lbl" x="630.0" y="343.0" text-anchor="middle">LAMBERTIAN, METAL,</text>
<text class="lbl" x="630.0" y="358.0" text-anchor="middle">PHONG, TRANSPARENT</text>
<line x1="411" y1="128" x2="411" y2="147" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="508" y1="175" x2="537" y2="175" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="411" y1="202" x2="411" y2="221" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="508" y1="256" x2="537" y2="256" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="630" y1="290" x2="630" y2="309" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<text class="dim" x="316" y="316" text-anchor="start">object -> MaterialID -> material</text>
<text class="dim" x="316" y="336" text-anchor="start">geometry never stores a color,</text>
<text class="dim" x="316" y="352" text-anchor="start">it only names its material.</text>
</svg>

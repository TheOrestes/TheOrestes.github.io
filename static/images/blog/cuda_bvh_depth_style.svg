<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Each BVH depth gets its own color from a ten-entry palette and its own line width: 8 pixels at the root shrinking toward 1.6 pixels at the deepest layer, shown for an example tree with depths 0 to 9.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
.ax{stroke:#6b7280;stroke-width:1.2;fill:none}
.grid{stroke:#374151;stroke-width:1;fill:none}
.dash{stroke:#9ca3af;stroke-width:1;stroke-dasharray:4 3;fill:none}
</style>
<text class="ttl" x="20" y="24" text-anchor="start">One style per depth (example tree with maximum depth 9, base width 8)</text>
<text class="mono" x="20" y="56" text-anchor="start">depth 0</text>
<line x1="90" y1="52" x2="330" y2="52" stroke="#ef4444" stroke-width="8.0"/>
<text class="mono" x="345" y="56" text-anchor="start">8.0 px</text>
<text class="dim" x="410" y="56" text-anchor="start">red</text>
<text class="mono" x="20" y="86" text-anchor="start">depth 1</text>
<line x1="90" y1="82" x2="330" y2="82" stroke="#f97316" stroke-width="7.288888888888889"/>
<text class="mono" x="345" y="86" text-anchor="start">7.3 px</text>
<text class="dim" x="410" y="86" text-anchor="start">orange</text>
<text class="mono" x="20" y="116" text-anchor="start">depth 2</text>
<line x1="90" y1="112" x2="330" y2="112" stroke="#facc15" stroke-width="6.5777777777777775"/>
<text class="mono" x="345" y="116" text-anchor="start">6.6 px</text>
<text class="dim" x="410" y="116" text-anchor="start">yellow</text>
<text class="mono" x="20" y="146" text-anchor="start">depth 3</text>
<line x1="90" y1="142" x2="330" y2="142" stroke="#22c55e" stroke-width="5.866666666666666"/>
<text class="mono" x="345" y="146" text-anchor="start">5.9 px</text>
<text class="dim" x="410" y="146" text-anchor="start">green</text>
<text class="mono" x="20" y="176" text-anchor="start">depth 4</text>
<line x1="90" y1="172" x2="330" y2="172" stroke="#22d3ee" stroke-width="5.155555555555555"/>
<text class="mono" x="345" y="176" text-anchor="start">5.2 px</text>
<text class="dim" x="410" y="176" text-anchor="start">cyan</text>
<text class="mono" x="20" y="206" text-anchor="start">depth 5</text>
<line x1="90" y1="202" x2="330" y2="202" stroke="#7dd3fc" stroke-width="4.444444444444445"/>
<text class="mono" x="345" y="206" text-anchor="start">4.4 px</text>
<text class="dim" x="410" y="206" text-anchor="start">light blue</text>
<text class="mono" x="20" y="236" text-anchor="start">depth 6</text>
<line x1="90" y1="232" x2="330" y2="232" stroke="#3b82f6" stroke-width="3.7333333333333325"/>
<text class="mono" x="345" y="236" text-anchor="start">3.7 px</text>
<text class="dim" x="410" y="236" text-anchor="start">blue</text>
<text class="mono" x="20" y="266" text-anchor="start">depth 7</text>
<line x1="90" y1="262" x2="330" y2="262" stroke="#a855f7" stroke-width="3.022222222222222"/>
<text class="mono" x="345" y="266" text-anchor="start">3.0 px</text>
<text class="dim" x="410" y="266" text-anchor="start">purple</text>
<text class="mono" x="20" y="296" text-anchor="start">depth 8</text>
<line x1="90" y1="292" x2="330" y2="292" stroke="#d946ef" stroke-width="2.311111111111111"/>
<text class="mono" x="345" y="296" text-anchor="start">2.3 px</text>
<text class="dim" x="410" y="296" text-anchor="start">magenta</text>
<text class="mono" x="20" y="326" text-anchor="start">depth 9</text>
<line x1="90" y1="322" x2="330" y2="322" stroke="#f9a8d4" stroke-width="1.5999999999999996"/>
<text class="mono" x="345" y="326" text-anchor="start">1.6 px</text>
<text class="dim" x="410" y="326" text-anchor="start">pink</text>
<text class="lbl" x="520" y="70" text-anchor="start">line width as depth grows</text>
<line x1="520" y1="100" x2="520" y2="250" stroke="#6b7280" stroke-width="1.2"/>
<line x1="520" y1="250" x2="730" y2="250" stroke="#6b7280" stroke-width="1.2"/>
<text class="dim" x="514" y="254.0" text-anchor="end">0</text>
<line x1="520" y1="250.0" x2="730" y2="250.0" stroke="#374151" stroke-width="1"/>
<text class="dim" x="514" y="179.0" text-anchor="end">4</text>
<line x1="520" y1="175.0" x2="730" y2="175.0" stroke="#374151" stroke-width="1"/>
<text class="dim" x="514" y="104.0" text-anchor="end">8</text>
<line x1="520" y1="100.0" x2="730" y2="100.0" stroke="#374151" stroke-width="1"/>
<polyline points="520.0,100.0 730.0,220.0" fill="none" stroke="#60a5fa" stroke-width="2.4"/>
<text class="dim" x="520" y="268" text-anchor="middle">root</text>
<text class="dim" x="730" y="268" text-anchor="middle">deepest</text>
<text class="dim" x="520" y="290" text-anchor="start">a straight line from 8 down to 1.6,</text>
<text class="dim" x="520" y="306" text-anchor="start">and never thinner than 1 pixel.</text>
<text class="dim" x="520" y="340" text-anchor="start">Deeper than 10 levels? The palette</text>
<text class="dim" x="520" y="356" text-anchor="start">wraps around and starts again.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Schlick's approximation: the fraction of light a glass or water surface reflects as the angle of incidence grows from 0 to 90 degrees. It starts near 4 percent for glass and 2 percent for water and shoots up to 100 percent at grazing angles.">

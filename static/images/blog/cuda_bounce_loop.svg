<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="The bounce loop: start with a white throughput, on every hit multiply it by the surface albedo and scatter, and when a ray escapes multiply the throughput by the sky color. An example path sphere, ground, sky is shown with its tinted throughput.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker></defs>
<style>
.ttl{font-family:system-ui,sans-serif;font-size:13px;fill:#c7d2fe}
.lbl{font-family:system-ui,sans-serif;font-size:12px;fill:#d1d5db}
.dim{font-family:system-ui,sans-serif;font-size:11px;fill:#9ca3af}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:#e5e7eb}
.ax{stroke:#6b7280;stroke-width:1.2;fill:none}
.grid{stroke:#374151;stroke-width:1;fill:none}
.dash{stroke:#9ca3af;stroke-width:1;stroke-dasharray:4 3;fill:none}
</style>
<text class="ttl" x="20" y="24" text-anchor="start">The bounce loop (up to 50 times per sample)</text>
<rect x="20" y="44" width="150" height="50" rx="6" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1.4"/>
<text class="lbl" x="95.0" y="65.5" text-anchor="middle">camera ray</text>
<text class="lbl" x="95.0" y="80.5" text-anchor="middle">throughput = white</text>
<rect x="240" y="44" width="150" height="50" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.4"/>
<text class="lbl" x="315.0" y="65.5" text-anchor="middle">HitWorld:</text>
<text class="lbl" x="315.0" y="80.5" text-anchor="middle">did the ray hit?</text>
<line x1="172" y1="69" x2="237" y2="69" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="240" y="150" width="150" height="60" rx="6" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1.4"/>
<text class="lbl" x="315.0" y="176.5" text-anchor="middle">throughput *= albedo</text>
<text class="lbl" x="315.0" y="191.5" text-anchor="middle">new ray: normal + random</text>
<line x1="315" y1="96" x2="315" y2="147" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<text class="dim" x="322" y="124" text-anchor="start" fill="#fbbf24">yes</text>
<line x1="240" y1="180" x2="205" y2="180" stroke="#e5e7eb" stroke-width="1.5"/>
<line x1="205" y1="180" x2="205" y2="69" stroke="#e5e7eb" stroke-width="1.5"/>
<text class="dim" x="197" y="130" text-anchor="end">next bounce</text>
<rect x="500" y="44" width="180" height="50" rx="6" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.4"/>
<text class="lbl" x="590.0" y="65.5" text-anchor="middle">pixel = throughput</text>
<text class="lbl" x="590.0" y="80.5" text-anchor="middle">* sky color, stop</text>
<line x1="392" y1="69" x2="497" y2="69" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<text class="dim" x="444" y="61" text-anchor="middle" fill="#a78bfa">no, it escaped</text>
<text class="dim" x="590" y="112" text-anchor="middle">if all 50 bounces hit something, the pixel stays black</text>
<text class="ttl" x="20" y="248" text-anchor="start">Example path: blue sphere, then yellow ground, then sky</text>
<rect x="20" y="266" width="130" height="44" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
<text class="dim" x="85" y="328" text-anchor="middle">start</text>
<text class="mono" x="85" y="344" text-anchor="middle">(1.00, 1.00, 1.00)</text>
<line x1="154" y1="288" x2="196" y2="288" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="200" y="266" width="130" height="44" rx="4" fill="#1a3380" stroke="#9ca3af" stroke-width="1"/>
<text class="dim" x="265" y="328" text-anchor="middle">after the sphere</text>
<text class="mono" x="265" y="344" text-anchor="middle">(0.10, 0.20, 0.50)</text>
<line x1="334" y1="288" x2="376" y2="288" stroke="#e5e7eb" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="380" y="266" width="130" height="44" rx="4" fill="#142900" stroke="#9ca3af" stroke-width="1"/>
<text class="dim" x="445" y="328" text-anchor="middle">after the ground</text>
<text class="mono" x="445" y="344" text-anchor="middle">(0.08, 0.16, 0.00)</text>
<text class="lbl" x="570" y="284" text-anchor="start">each hit can only</text>
<text class="lbl" x="570" y="302" text-anchor="start">remove light, never add it:</text>
<text class="lbl" x="570" y="320" text-anchor="start">the color gets darker</text>
<text class="lbl" x="570" y="338" text-anchor="start">and more tinted.</text>
<text class="dim" x="20" y="378" text-anchor="start">Albedo values are the two spheres from this post's scene. The sphere (0.1, 0.2, 0.5) comes first, then the ground (0.8, 0.8, 0.0).</text>
</svg>

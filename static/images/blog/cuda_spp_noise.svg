<text class="dim" x="390" y="340" text-anchor="middle">samples per pixel (log scale)</text>
<text class="dim" x="390" y="372" text-anchor="middle">Ten times cleaner needs a hundred times the samples, which is why the render stops at a fixed count.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" width="760" height="385" role="img" aria-label="Noise against samples per pixel on log axes: noise falls as one over the square root of the sample count, so 4 times the samples halves the noise and 100 samples leaves a tenth of the single-sample noise.">

<line x1="80" y1="300.0" x2="700" y2="300.0" stroke="#374151" stroke-width="1"/>
<text class="dim" x="72" y="304.0" text-anchor="end">0.01</text>
<line x1="80.0" y1="50" x2="80.0" y2="300" stroke="#374151" stroke-width="1"/>
<text class="dim" x="80.0" y="318" text-anchor="middle">1</text>
<line x1="286.66666666666663" y1="50" x2="286.66666666666663" y2="300" stroke="#374151" stroke-width="1"/>
